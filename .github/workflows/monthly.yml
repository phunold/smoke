name: monthly

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      tools:
        description: "comma list of tools (blank = repo variable SMOKE_TOOLS, else default below)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run python test_detect.py
      - run: uv run python smoke.py generate

      # Pages source must be "GitHub Actions" (Settings > Pages). Deploying here
      # instead of from a branch push makes the deploy part of this run.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: run
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.page_url }}
          # Tavily is left out by default: its ToS may restrict publishing results,
          # and everything this job commits is public. Decide before adding it.
          TOOLS: ${{ inputs.tools || vars.SMOKE_TOOLS || 'trafilatura,html2text,markitdown,jina,firecrawl_md,firecrawl_json,exa,context_dev' }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          CONTEXT_DEV_API_KEY: ${{ secrets.CONTEXT_DEV_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: uv run python smoke.py run --tools "$TOOLS"
      - run: uv run python smoke.py report
      - run: uv run python smoke.py flips

      - name: commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A docs results raw flips
          git commit -m "Monthly run $(ls docs/f | tail -1)"
          git push
